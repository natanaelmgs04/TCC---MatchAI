<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../css/style.css">
<link rel="stylesheet" href="https://unpkg.com/lenis@1.3.26/dist/lenis.css">
<style>
  .env-wrap { max-width: 980px; margin: 0 auto; padding: 48px 24px 96px; display: grid; gap: 24px; }
  .env-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; align-items: start; }
  @media (max-width: 760px) { .env-grid { grid-template-columns: 1fr; } }
  #stage { position: relative; height: 360px; border-radius: var(--radius-md); overflow: hidden; background: var(--bg-alt); }
  #stage canvas { display: block; width: 100%; height: 100%; }
  .checks { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; font-size: 0.88rem; }
  .checks li { display: flex; justify-content: space-between; gap: 12px; padding: 8px 0; border-bottom: 1px dashed var(--line); }
  .checks li:last-child { border-bottom: none; }
  .checks .ok { color: var(--sage-dark); font-weight: 600; }
  .checks .fail { color: var(--terracotta-dark); font-weight: 600; }
  .checks .wait { color: var(--ink-faint); }
  #summary { font-weight: 600; }
</style>
</head>
<body>
<main class="env-wrap">
  <div>
    <span class="eyebrow">Somente desenvolvimento</span>
    <h1>Ambiente 3D do match.IA</h1>
    <p class="card-lead">Verifica se three.js, carregadores GLTF/Draco, GSAP, ScrollTrigger, Lenis e lil-gui carregam pelo import map canônico, com SRI. Não faz parte do site público.</p>
  </div>

  <div class="env-grid">
    <div class="dash-card"><div id="stage" aria-label="Cena de teste three.js"></div></div>
    <div class="dash-card">
      <h3>Verificações</h3>
      <ul class="checks" id="checks"></ul>
      <p id="summary" class="wait">Rodando…</p>
    </div>
  </div>
</main>

<script type="module">
const list = document.getElementById('checks');
const results = [];
function row(label) {
  const li = document.createElement('li');
  li.innerHTML = `<span></span><span class="wait">…</span>`;
  li.firstChild.textContent = label;
  list.append(li);
  return (ok, detail) => {
    const s = li.lastChild;
    s.className = ok ? 'ok' : 'fail';
    s.textContent = (ok ? '✓ ' : '✗ ') + (detail || '');
    results.push(ok);
  };
}
async function check(label, fn) {
  const done = row(label);
  try { done(true, await fn()); }
  catch (err) { done(false, err?.message || String(err)); console.error(label, err); }
}

const webgl2 = !!document.createElement('canvas').getContext('webgl2');
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

await check('WebGL2 disponível', async () => { if (!webgl2) throw new Error('sem WebGL2 — usar fallback'); return 'sim'; });

let THREE, scene, camera, renderer, mesh;
await check('three (core)', async () => {
  THREE = await import('three');
  return `r${THREE.REVISION}`;
});

await check('OrbitControls + RoomEnvironment + render', async () => {
  const [{ OrbitControls }, { RoomEnvironment }] = await Promise.all([
    import('three/addons/controls/OrbitControls.js'),
    import('three/addons/environments/RoomEnvironment.js'),
  ]);
  const host = document.getElementById('stage');
  renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(host.clientWidth, host.clientHeight);
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  host.append(renderer.domElement);
  scene = new THREE.Scene();
  const pmrem = new THREE.PMREMGenerator(renderer);
  scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
  pmrem.dispose();
  camera = new THREE.PerspectiveCamera(40, host.clientWidth / host.clientHeight, 0.1, 100);
  camera.position.set(3, 2, 4);
  new OrbitControls(camera, renderer.domElement).enableDamping = true;
  // Paleta do site: terracota (#B0755A) e sálvia (#7B8E7E).
  mesh = new THREE.Mesh(new THREE.BoxGeometry(1.4, 1, 1.4), new THREE.MeshStandardMaterial({ color: 0xB0755A, roughness: 0.55 }));
  scene.add(mesh);
  const floor = new THREE.Mesh(new THREE.CircleGeometry(3, 48), new THREE.MeshStandardMaterial({ color: 0x7B8E7E, roughness: 0.9 }));
  floor.rotation.x = -Math.PI / 2; floor.position.y = -0.5;
  scene.add(floor);
  renderer.setAnimationLoop(() => renderer.render(scene, camera));
  return 'ok';
});

await check('GLTFLoader + DRACOLoader (decodifica modelo Draco)', async () => {
  const [{ GLTFLoader }, { DRACOLoader }] = await Promise.all([
    import('three/addons/loaders/GLTFLoader.js'),
    import('three/addons/loaders/DRACOLoader.js'),
  ]);
  const draco = new DRACOLoader().setDecoderPath('https://unpkg.com/three@0.186.1/examples/jsm/libs/draco/gltf/');
  const loader = new GLTFLoader().setDRACOLoader(draco);
  const gltf = await loader.loadAsync('https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Assets/main/Models/Box/glTF-Draco/Box.gltf');
  let tris = 0;
  gltf.scene.traverse((o) => { if (o.isMesh) tris += o.geometry.index ? o.geometry.index.count / 3 : o.geometry.attributes.position.count / 3; });
  gltf.scene.scale.setScalar(0.5); gltf.scene.position.set(1.4, 0, 0);
  scene.add(gltf.scene);
  draco.dispose();
  return `${tris} triângulos`;
});

await check('HDRLoader (import)', async () => { await import('three/addons/loaders/HDRLoader.js'); return 'ok'; });

await check('gsap + ScrollTrigger', async () => {
  const { gsap } = await import('gsap');
  const { ScrollTrigger } = await import('gsap/ScrollTrigger');
  gsap.registerPlugin(ScrollTrigger);
  if (!reduceMotion) gsap.to(mesh.rotation, { y: Math.PI * 2, duration: 6, repeat: -1, ease: 'none' });
  return `v${gsap.version}`;
});

await check('lenis', async () => {
  const { default: Lenis } = await import('lenis');
  const lenis = new Lenis({ autoRaf: true });
  const v = lenis.constructor.version || 'ok';
  lenis.destroy();
  return String(v);
});

await check('lil-gui (debug)', async () => {
  const { default: GUI } = await import('lil-gui');
  const gui = new GUI({ title: 'debug (dev)' });
  gui.addColor(mesh.material, 'color');
  gui.add(mesh.material, 'roughness', 0, 1);
  return 'ok';
});

const summary = document.getElementById('summary');
const allOk = results.every(Boolean);
summary.className = allOk ? 'ok' : 'fail';
summary.textContent = allOk ? 'Ambiente pronto para o configurador 3D.' : 'Há falhas — veja o console.';
window.__envCheck = { ok: allOk, passed: results.filter(Boolean).length, total: results.length };
</script>
