<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<script>try{var t=localStorage.getItem('matchia_theme');if(t==='dark'||t==='light')document.documentElement.dataset.theme=t;}catch(e){}</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Gestão — match.IA</title>
<link rel="icon" type="image/png" href="assets/img/favicon.png">
<meta name="theme-color" content="#B0755A">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Inter:wght@400;500;600;700;800&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
<link rel="stylesheet" href="assets/css/dashboard.css">
<link rel="stylesheet" href="assets/css/admin.css">
</head>
<body class="adm-body">

<!-- Entrada da equipe: mesma conta do site, liberada por ADMIN_EMAILS no servidor -->
<section class="adm-gate" id="admGate" hidden>
  <div class="adm-gate-card">
    <a href="index.html" class="logo adm-logo"><img src="assets/img/mark.png" alt="" width="34" height="34"><span class="logo-word">match<span class="ia">.IA</span></span></a>
    <span class="eyebrow">Painel da equipe</span>
    <h1>Gestão da plataforma</h1>
    <p id="admGateLead">Entre com a sua conta match.IA. Só e-mails da equipe têm acesso.</p>
    <form id="admLogin" novalidate>
      <div class="form-field"><label for="admEmail">E-mail</label><input type="email" id="admEmail" autocomplete="username" required></div>
      <div class="form-field"><label for="admPass">Senha</label><input type="password" id="admPass" autocomplete="current-password" required></div>
      <p class="adm-error" id="admLoginError" role="alert"></p>
      <button class="btn btn-primary btn-block" type="submit">Entrar</button>
    </form>
    <a class="adm-back" href="index.html">← Voltar ao site</a>
  </div>
</section>

<div class="adm-app" id="admApp" hidden>
  <aside class="adm-side" id="admSide">
    <a href="admin.html" class="logo adm-logo"><img src="assets/img/mark.png" alt="" width="30" height="30"><span class="logo-word">match<span class="ia">.IA</span></span></a>
    <span class="adm-side-tag">Gestão</span>
    <nav class="adm-nav" id="admNav" aria-label="Seções do painel"></nav>
    <div class="adm-side-foot">
      <div class="adm-me" id="admMe"></div>
      <div class="adm-side-actions">
        <a href="index.html" target="_blank" rel="noopener" class="adm-mini-btn" data-icon="external">Ver site</a>
        <button type="button" class="adm-mini-btn" id="admLogout" data-icon="logout">Sair</button>
      </div>
    </div>
  </aside>

  <div class="adm-main">
    <header class="adm-top">
      <button type="button" class="adm-burger" id="admBurger" aria-label="Abrir menu"><span></span><span></span><span></span></button>
      <div class="adm-top-title"><span class="eyebrow" id="admCrumb">Gestão</span><h1 id="admTitle">Visão geral</h1></div>
      <div class="adm-top-actions">
        <button type="button" class="adm-icon-btn" id="admRefresh" aria-label="Atualizar" title="Atualizar"></button>
        <button class="theme-toggle" id="themeToggle" aria-label="Alternar tema" type="button"></button>
      </div>
    </header>
    <main class="adm-view" id="admView" aria-live="polite"></main>
  </div>

  <!-- Detalhe de usuário (gaveta lateral) -->
  <div class="adm-scrim" id="admScrim" hidden></div>
  <aside class="adm-drawer" id="admDrawer" aria-hidden="true" aria-label="Detalhes da conta">
    <button type="button" class="adm-drawer-x" id="admDrawerX" aria-label="Fechar"></button>
    <div id="admDrawerBody"></div>
  </aside>
</div>

<div class="adm-toast" id="admToast" role="status" aria-live="polite"></div>

<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs><linearGradient id="dvRingGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="var(--sage)"/><stop offset="1" stop-color="var(--terracotta)"/></linearGradient></defs>
</svg>

<script src="assets/js/api.js"></script>
<script src="assets/js/theme.js"></script>
<script src="assets/js/dashboard-ui.js"></script>
<script src="assets/js/admin.js"></script>
</body>
</html>
